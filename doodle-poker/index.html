<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle Poker</title>
<meta name="description" content="Doodle Poker: a poker companion for recording hands and sessions, remembering the players, and doodling all over it.">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root { --paper: #fffaf0; --ink: #2d2a3e; --teal: #19a090; --sky: #cfe8ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sky); color: var(--ink); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 32px auto; padding: 28px 24px 32px; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; text-align: center; }
  @media (max-width: 720px) { main { margin: 16px; } }
  h1 { font-family: "Permanent Marker", cursive; font-weight: 400; font-size: 2.4rem; margin: 0.2em 0 0.1em; }
  .tag { color: var(--teal); font-family: "Permanent Marker", cursive; font-size: 1.2rem; margin: 0 0 1em; }
  img { width: 120px; height: 120px; }
  a { color: var(--teal); font-weight: 700; }
  footer { margin-top: 2em; font-size: 0.85rem; opacity: 0.7; }
</style>
</head>
<body>
<main>
<img src="icon.png" alt="The Doodle Poker mark">
<h1>Doodle Poker</h1>
<p class="tag">Every hand tells a story.</p>
<p>A poker companion: record your hands and sessions, remember the players, and doodle all over it.</p>
<footer><a href="../">chchmatt</a></footer>
</main>
</body>
</html>
